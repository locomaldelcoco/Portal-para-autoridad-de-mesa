spring.application.name=portal-autoridad-de-mesa
spring.datasource.url=jdbc:h2:file:./data/portal;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Administrador (RNF-03). Sobrescribir con variables de entorno.
portal.admin.usuario=${PORTAL_ADMIN_USER:admin}
portal.admin.password=${PORTAL_ADMIN_PASSWORD:cambiar-esto}
# Casilla del administrador que recibe los reportes (RF-07, RF-14)
portal.admin.email=${PORTAL_ADMIN_EMAIL:administrador@organismo.invalid}

# Fecha de la elección (AAAA-MM-DD). Si se define, toda charla debe ser anterior a ella (RF-01)
portal.eleccion.fecha=${PORTAL_ELECCION_FECHA:}

# Servidor de correo institucional (RF-15). Se configura con SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
portal.correo.remitente=${PORTAL_CORREO_REMITENTE:no-reply@organismo.invalid}
portal.correo.reintento-ms=60000

# Clave AES de 256 bits en Base64 para cifrar DNI, domicilio y afiliación (RNF-04).
# La de abajo es SOLO para desarrollo: en producción definir PORTAL_CIFRADO_CLAVE.
portal.cifrado.clave=${PORTAL_CIFRADO_CLAVE:/Nm6JCwAatzgfB3CerJBe9xZnL7dFU1nGzsrwRsWf9I=}
