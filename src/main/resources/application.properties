spring.application.name=portal-autoridad-de-mesa
# Base H2 en archivo (persiste entre reinicios). Para produccion cambiar por PostgreSQL/MySQL.
spring.datasource.url=jdbc:h2:file:./data/portal;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Credenciales del panel de administracion (sobrescribir con variables de entorno)
portal.admin.usuario=${PORTAL_ADMIN_USER:admin}
portal.admin.password=${PORTAL_ADMIN_PASSWORD:cambiar-esto}
