<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Autoridades de Mesa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Portal de Autoridades de Mesa</h1>
    <nav><a href="#charlas">Charlas</a><a href="#inscripcion">Inscribirme</a><a href="admin.html">Administración</a></nav>
  </header>
  <main>
    <section id="charlas">
      <h2>Próximas charlas informativas</h2>
      <p>Conocé cuáles son las tareas de una autoridad de mesa y resolvé tus dudas.</p>
      <div id="lista-charlas">Cargando…</div>
    </section>

    <section id="inscripcion">
      <h2>Inscripción para ser autoridad de mesa</h2>
      <form id="form-inscripcion" novalidate>
        <label>Nombre<input name="nombre" required maxlength="100" autocomplete="given-name"><span class="err"></span></label>
        <label>Apellido<input name="apellido" required maxlength="100" autocomplete="family-name"><span class="err"></span></label>
        <label>DNI (sin puntos)<input name="dni" required inputmode="numeric" pattern="\d{7,8}"><span class="err"></span></label>
        <label>Fecha de nacimiento<input name="fechaNacimiento" type="date" required><span class="err"></span></label>
        <label>Email<input name="email" type="email" required autocomplete="email"><span class="err"></span></label>
        <label>Teléfono<input name="telefono" type="tel" required maxlength="30" autocomplete="tel"><span class="err"></span></label>
        <label>Domicilio<input name="domicilio" required autocomplete="street-address"><span class="err"></span></label>
        <label>Localidad<input name="localidad" required><span class="err"></span></label>
        <label class="check"><input type="checkbox" name="aceptaTerminos"> Declaro que los datos son verdaderos y acepto el tratamiento de mis datos personales para este fin.</label>
        <span class="err ancho" data-campo="aceptaTerminos"></span>
        <div class="acciones"><button type="submit">Inscribirme</button></div>
      </form>
      <div id="resultado" role="status"></div>
    </section>
  </main>

  <script type="module">
    import { api, esc, formatearFecha } from './app.js';

    // --- Charlas ---
    const lista = document.getElementById('lista-charlas');
    try {
      const charlas = await api('/api/charlas');
      lista.innerHTML = charlas.length ? charlas.map(c => `
        <article class="charla">
          <h3>${esc(c.titulo)}</h3>
          <div class="meta">📅 ${esc(formatearFecha(c.fechaHora))}<br>
            📍 ${esc(c.lugar)} — ${esc(c.direccion)}, ${esc(c.localidad)}
            · <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.direccion + ', ' + c.localidad)}">Ver mapa</a></div>
          ${c.descripcion ? `<p>${esc(c.descripcion)}</p>` : ''}
          <div class="temas">${c.temas.map(t => `<span>${esc(t)}</span>`).join('')}</div>
        </article>`).join('') : '<p>No hay charlas programadas por el momento.</p>';
    } catch (e) { lista.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }

    // --- Inscripción ---
    const form = document.getElementById('form-inscripcion');
    const resultado = document.getElementById('resultado');

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      form.querySelectorAll('.err').forEach(s => s.textContent = '');
      resultado.className = ''; resultado.textContent = '';
      const d = Object.fromEntries(new FormData(form));
      d.aceptaTerminos = form.aceptaTerminos.checked;
      const boton = form.querySelector('button');
      boton.disabled = true;
      try {
        await api('/api/inscripciones', { method: 'POST', body: JSON.stringify(d) });
        form.reset();
        resultado.className = 'msg ok';
        resultado.textContent = '¡Listo! Tu inscripción fue registrada. Te contactaremos por email.';
      } catch (e) {
        resultado.className = 'msg error';
        resultado.textContent = e.message;
        for (const [campo, mensaje] of Object.entries(e.campos)) {
          const el = form.querySelector(`[name="${campo}"]`)?.parentElement.querySelector('.err')
                  ?? form.querySelector(`[data-campo="${campo}"]`);
          if (el) el.textContent = mensaje;
        }
      } finally { boton.disabled = false; }
    });
  </script>
</body>
</html>
